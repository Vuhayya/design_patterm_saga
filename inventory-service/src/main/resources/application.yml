# =====================================================================================
# INVENTORY SERVICE - independent microservice, independent database
# =====================================================================================
server:
  port: ${INVENTORY_SERVICE_PORT:8082}

spring:
  application:
    name: inventory-service

  # THIS SERVICE'S OWN DATABASE: inventory-service/data/inventorydb.mv.db
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:h2:file:./data/inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${INVENTORY_DB_DRIVER:org.h2.Driver}
    username: ${INVENTORY_DB_USERNAME:sa}
    password: ${INVENTORY_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true           # http://localhost:8082/h2-console
      path: /h2-console

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

demo:
  processing-delay-ms: ${INVENTORY_PROCESSING_DELAY_MS:150}

logging:
  level:
    com.sagademo.inventory: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([INVENTORY_SERVICE]){blue} %clr([saga=%X{sagaId:-none}] [order=%X{orderId:-none}]){cyan} %clr(%-32.32logger{0}){faint} %msg%n"
